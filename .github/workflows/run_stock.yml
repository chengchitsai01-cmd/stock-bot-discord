name: Stock Bot Per 5 Minutes

on:
  schedule:
    # 每 5 分鐘執行一次 (GitHub Actions 實際上可能會有數分鐘延遲)
    - cron: '*/5 * * * *'
  workflow_dispatch: # 保留這個，讓你可以手動點擊執行（主動查詢）

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: 檢出程式碼
      uses: actions/checkout@v3

    - name: 設定 Python 環境
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'

    - name: 安裝必要套件
      run: |
        python -m pip install --upgrade pip
        # 這裡把 google-generativeai 換成了 google-genai
        pip install yfinance pandas google-genai requests

    - name: 執行股票分析程式
      env:
        # 這裡將 GitHub Secrets 傳遞給程式
        GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
        DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      run: python stock.py
