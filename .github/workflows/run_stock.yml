name: Stock Bot Per 5 Minutes

on:
  schedule:
    # 台灣時間 09:10, 09:40 ... 直到 13:40 (共 10 次執行)
    # UTC 時間為 01:10 到 05:40
    - cron: '10/30 1-5 * * 1-5'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: 檢出程式碼
      uses: actions/checkout@v5

    - name: 設定 Python 環境
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'

    - name: 安裝必要套件
      run: |
        python -m pip install --upgrade pip
        # 這裡把 google-generativeai 換成了 google-genai
        pip install yfinance pandas google-genai requests

    - name: 執行股票分析程式
      env:
        # 這裡將 GitHub Secrets 傳遞給程式
        GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
        DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      run: python stock.py
