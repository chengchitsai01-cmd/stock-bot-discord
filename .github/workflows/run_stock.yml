name: Quant Bot 4.0 Daily Scan

on:
  schedule:
    # 台灣時間週一至週五 09:30 執行一次 (UTC 01:30)
    - cron: '30 1 * * 1-5'
  workflow_dispatch: # 保留手動測試按鈕

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install discord.py yfinance pandas matplotlib Flask

      - name: Run Quant Strategy
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
          # 🌟 關鍵：告訴程式現在是排程模式，跑完就關機
          RUN_MODE: github_cron
        run: python main.py
